name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails if package-lock.json is out of sync rather than
      # silently resolving a different tree than the one that was reviewed.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # No API key in CI on purpose: the build must succeed without it, which
      # is what proves the AI panel is genuinely optional.
      - name: Build
        run: npm run build
