# Build configuration lives here rather than in the Netlify dashboard so it is
# versioned, reviewable, and travels with the branch — a deploy preview builds
# with the settings from its own commit.

[build]
  command = "npm run build"
  publish = ".next"

# Declared explicitly rather than relying on framework auto-detection.
#
# This site is server-rendered: `.next` has no index.html at its root (the
# prerendered document is at .next/server/app/index.html) and /api/ask needs a
# function. Published as a plain static directory, every path 404s. The runtime
# is what maps prerendered routes and turns the route handler into a function.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # `ai` and `@ai-sdk/*` declare engines >= 22, so Node 20 is not viable.
  # Keep this, .nvmrc, and .github/workflows/ci.yml on the same major version.
  NODE_VERSION = "24"
